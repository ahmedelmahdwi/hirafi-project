<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - حرفي</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- شريط التنقل -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo"><i class="fas fa-tools"> </i> حرفي</a>
            <input type="checkbox" id="menu-toggle" class="menu-checkbox">
            <label for="menu-toggle" class="menu-toggle">
                <i class="fas fa-bars"></i>
            </label>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="categories.html">الفئات</a></li>
                <li><a href="login.html">تسجيل الدخول</a></li>
                <li><a href="booking.html" class="active">حجز موعد</a></li>
            </ul>
        </div>
    </nav>

    <!-- نموذج الحجز -->
    <section class="categories" style="padding: 40px 0;">
        <div class="container">
            <h2 class="section-title">حجز موعد</h2>
            <form class="booking-form" id="bookingForm" action="thank-you.html" method="get">
                <div class="form-group">
                    <label for="name">الاسم الكامل</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="phone">رقم الهاتف</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="service">نوع الخدمة</label>
                    <select id="service" name="service" required>
                        <option value="">اختر الخدمة</option>
                        <option value="طبيب أسنان">طبيب أسنان</option>
                        <option value="نجار">نجار</option>
                        <option value="سباك">سباك</option>
                        <option value="مبرمج">مبرمج</option>
                        <option value="معلم خصوصي">معلم خصوصي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="professional">المحترف (اختياري)</label>
                    <input type="text" id="professional" name="professional" placeholder="اسم المحترف إذا كنت تعرفه">
                </div>
                <div class="form-group">
                    <label for="date">التاريخ والوقت</label>
                    <input type="datetime-local" id="date" name="date" required>
                </div>
                <div class="form-group">
                    <label for="message">ملاحظات إضافية</label>
                    <textarea id="message" name="message" placeholder="أي تفاصيل إضافية تريد إضافتها..."></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">تأكيد الحجز</button>
            </form>
        </div>
    </section>

    <!-- التذييل -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>حرفي</h3>
                    <p>منصة عربية تهدف إلى ربط المستخدمين مع المحترفين في مختلف المجالات</p>
                </div>
                <div class="footer-section">
                    <h3>روابط سريعة</h3>
                    <ul>
                        <li><a href="index.html">الرئيسية</a></li>
                        <li><a href="categories.html">الفئات</a></li>
                        <li><a href="login.html">تسجيل الدخول</a></li>
                        <li><a href="booking.html">حجز موعد</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>اتصل بنا</h3>
                    <p><i class=" fa-envelope"></i> info@harfy.com</p>
                    <p><i class=" fa-phone"></i>+218 94 632 5075</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>جميع الحقوق محفوظة &copy; 2025 حرفي</p>
            </div>
        </div>
    </footer>
</body>
</html>
